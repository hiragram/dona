[mcp_servers.dona_slack]
command = "node"
args = ["dist/mcp/index.js"]
cwd = "sources/slack"
enabled = true
required = false
enabled_tools = ["list_workspaces", "list_channels", "get_channel", "check_user_channel_access", "list_users", "get_user", "get_thread", "get_reactions", "get_file", "set_agent_session_status", "post_message", "add_reaction"]
default_tools_approval_mode = "writes"
startup_timeout_sec = 20
tool_timeout_sec = 60

[mcp_servers.dona_dispatcher]
command = "node"
args = ["dist/mcp/index.js"]
cwd = "dispatcher"
enabled = true
required = false
enabled_tools = ["delegate_job", "list_thread_jobs", "list_owner_jobs", "get_job_status", "authorize_job_notification", "steer_job", "cancel_job", "plan_self_update", "apply_self_update", "get_self_update_status", "cancel_self_update"]
default_tools_approval_mode = "writes"
startup_timeout_sec = 20
tool_timeout_sec = 30
