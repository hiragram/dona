name: CI

on:
  pull_request:
  pull_request_target:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-skills:
    name: Verify project Skills
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate project Skills
        run: npm run test:skills

      - name: Validate scheduler decision fixtures
        run: npm run test:scheduler-contract

  verify:
    name: Verify ${{ matrix.component }}
    if: github.event_name != 'pull_request_target'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: dispatcher
            runner: ubuntu-24.04
          - component: sources/slack
            runner: macos-26
          - component: updater
            runner: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Run tests
        run: npm test
        working-directory: ${{ matrix.component }}

      - name: Repeat updater process race regression
        if: matrix.component == 'updater'
        run: for attempt in 1 2 3 4 5; do echo "Race test attempt $attempt"; npm run test:process-race; done
        working-directory: updater

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.component }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.component }}

  self-hosted-macos:
    name: Verify self-hosted macOS
    if: github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    runs-on:
      group: Default
      labels: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate project Skills and scheduler fixtures
        run: npm run test:skills && npm run test:scheduler-contract

      - name: Install and verify dispatcher
        run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: dispatcher

      - name: Install and verify Slack adapter
        run: npm ci && npm test && npm run typecheck && npm run build
        working-directory: sources/slack

      - name: Install and verify updater
        run: npm ci && npm test && npm run typecheck && npm run build && for attempt in 1 2 3 4 5; do echo "Race test attempt $attempt"; npm run test:process-race; done
        working-directory: updater
