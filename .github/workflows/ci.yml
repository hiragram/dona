name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  project-skills:
    name: Verify project Skills
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Validate project Skills
        run: npm run test:skills

  verify:
    name: Verify ${{ matrix.component }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: dispatcher
            runner: ubuntu-24.04
          - component: sources/slack
            runner: macos-26
          - component: updater
            runner: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.component }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.component }}

      - name: Run tests
        run: npm test
        working-directory: ${{ matrix.component }}

      - name: Run typecheck
        run: npm run typecheck
        working-directory: ${{ matrix.component }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.component }}
